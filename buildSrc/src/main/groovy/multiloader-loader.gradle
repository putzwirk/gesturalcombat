plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "${project.group}:${mod_id}"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}



def collectedJar = tasks.register('collectJar', Copy) {

    into(rootProject.layout.projectDirectory.dir('jars'))

}



afterEvaluate {

    def packedJar = tasks.findByName('remapJar') != null ? tasks.named('remapJar') : tasks.named('jar')

    collectedJar.configure {

        dependsOn(packedJar)

        from(packedJar.flatMap { it.archiveFile })

    }

}



tasks.named('build') {

    finalizedBy('collectJar')

}
