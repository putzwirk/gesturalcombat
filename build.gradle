plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.77'
}

version = "${mc_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        configureEach {
            systemProperty 'net.minecraftforge.gradle.GradleStart.srg.srg-mcp', layout.projectDirectory.file('build/moddev/artifacts/intermediateToNamed.srg').asFile.absolutePath
        }
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:0.8.5-SNAPSHOT:processor"
    compileOnly files("libs/player-animation-lib-forge-1.0.2-rc1+1.20.jar")
    compileOnly files("libs/bettercombat-forge-1.9.0+1.20.1.jar")
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')
    from(layout.buildDirectory.dir('mixin')) {
        include "${mod_id}.refmap.json"
    }
    var replaceProperties = [
            mc_version: mc_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'MixinConfigs'              : "${mod_id}.mixins.json",
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
