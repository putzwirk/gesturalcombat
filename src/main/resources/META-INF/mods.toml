modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Gestural Combat"
authors="${mod_authors}"
description='''
Draw weapon-specific mouse gestures in combat, unlock signature techniques through a per-tool mastery skill tree.
'''
logoFile="icon.png"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${mc_version}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="[1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="bettercombat"
    mandatory=true
    versionRange="[1.9.0,)"
    ordering="AFTER"
    side="BOTH"
